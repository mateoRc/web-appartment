name: mare-beachfront
services:
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./locales.js:/usr/share/nginx/html/locales.js:ro
      - ./calendar.js:/usr/share/nginx/html/calendar.js:ro
      - ./offline.js:/usr/share/nginx/html/offline.js:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./historical:/usr/share/nginx/html/historical:ro
    restart: unless-stopped
